name: Universe check

# Fetches and parses each market's official listing without screening or
# committing anything. Use it to confirm exchange sources still parse, for
# example after an exchange changes its file format. Read-only, and outside the
# data workflows' lock, so it never waits behind a long screening run.
on:
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to check (comma separated, or 'all')"
        required: false
        default: "all"
      probe:
        description: "Also report how current each LSE source file is"
        type: boolean
        required: false
        default: false
      symbols:
        description: "Optional Yahoo symbols whose raw cash-flow labels to print"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and parse the universe
        if: github.event.inputs.symbols == ''
        run: |
          python -m fcf_factor universe \
            --markets "${{ github.event.inputs.markets || 'all' }}" \
            --dry-run --allow-integrity-failure

      - name: Probe source freshness
        if: github.event.inputs.probe == 'true'
        run: python -m fcf_factor probe-sources --scan

      - name: Probe statement labels
        if: github.event.inputs.symbols != ''
        env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: python -m fcf_factor probe-statements --symbols "$SYMBOLS"
