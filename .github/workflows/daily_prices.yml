name: Daily price capture

# Collects daily bars for every security in the five live portfolios, then rolls
# each portfolio's NAV forward. Runs after every weekday's US close.
on:
  schedule:
    - cron: "35 23 * * 1-5"
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to update (comma separated, or 'all')"
        required: false
        default: "all"
      lookback_days:
        description: "Calendar days of history to re-request and backfill"
        required: false
        default: "10"

permissions:
  contents: write

# Shares a concurrency group with the quarterly workflow so two jobs never try
# to push generated data at the same time.
concurrency:
  group: fcf-factor-data
  cancel-in-progress: false

jobs:
  prices:
    name: Capture prices and update portfolios
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect daily prices
        env:
          PROVIDER_MAX_WORKERS: "4"
          PROVIDER_REQUEST_PAUSE: "0.25"
        run: |
          python -m fcf_factor daily-prices \
            --markets "${{ github.event.inputs.markets || 'all' }}" \
            --lookback-days "${{ github.event.inputs.lookback_days || '10' }}"

      - name: Execute pending signals and roll NAV forward
        run: python -m fcf_factor update-portfolio --markets "${{ github.event.inputs.markets || 'all' }}"

      - name: Refresh reports
        run: python -m fcf_factor report

      - name: Commit generated data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No new sessions to record."
            exit 0
          fi
          git commit -m "Update FCF factor data $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt ${attempt} failed; retrying"
            sleep $((2 ** attempt))
          done
          exit 1
